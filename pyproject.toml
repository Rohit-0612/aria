[project]
name = "aria"
version = "0.1.0"
description = "Multi-agent, retrieval-augmented clinical pharmacotherapy assistant"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["aria_env", "web", "data"]

[tool.ruff.format]
# Same scope boundary as the lint per-file-ignores and the mypy overrides:
# reformatting ingestion/vectorstore would produce a large diff in files this
# change does not touch.
exclude = [
    "ingestion/chunker.py",
    "ingestion/ocr_loader.py",
    "ingestion/pdf_loader.py",
    "ingestion/ingest_rxprep.py",
    "vectorstore/*.py",
    "migrate_to_qdrant.py",
    "llm/prompts.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF", "BLE"]
# E402: api/server.py and retrieval/reranker.py must call load_dotenv() before
# importing modules that read credentials at import time.
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
# Prompt text is data, not code: reflowing it to satisfy a line-length rule
# would silently change what the model is asked.
"llm/prompts.py" = ["E501", "RUF001"]
"agents/guardrail_agent.py" = ["E501"]
"agents/context_agent.py" = ["E501"]
"agents/judge_agent.py" = ["E501"]
# Eval prompts and labelled cases are data, for the same reason.
"evals/*.py" = ["E501"]
# Ingestion and the vector-store adapters are outside the scope of the model
# refactor — untouched, and not on the request path. Same boundary as the
# mypy overrides below.
"ingestion/chunker.py" = ["ALL"]
"ingestion/ocr_loader.py" = ["ALL"]
"ingestion/pdf_loader.py" = ["ALL"]
"ingestion/ingest_rxprep.py" = ["ALL"]
"vectorstore/*.py" = ["ALL"]
"migrate_to_qdrant.py" = ["ALL"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["agents", "api", "graph", "llm", "evals", "retrieval", "ingestion"]
# ragas_eval.py runs in its own env (evals/requirements-ragas.txt) against
# LangChain 0.3; checking it against the app's LangChain 1.x stubs is noise.
exclude = ["aria_env", "evals/ragas_eval\\.py"]

# LangChain, Qdrant, Cohere and sentence-transformers ship partial or absent
# type information; ARIA's own code stays strict regardless.
[[tool.mypy.overrides]]
module = [
    "langchain.*",
    "langchain_core.*",
    "langchain_groq.*",
    "langchain_cohere.*",
    "langchain_huggingface.*",
    "langchain_qdrant.*",
    "langgraph.*",
    "qdrant_client.*",
    "sentence_transformers.*",
    "dotenv.*",
]
ignore_missing_imports = true

# Ingestion and the vector-store adapters are outside the scope of this
# change: untouched, untyped, and not on the request path.
[[tool.mypy.overrides]]
module = ["ingestion.*", "vectorstore.*", "migrate_to_qdrant"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
